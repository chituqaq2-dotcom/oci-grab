name: grab
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "a1 | micro | open:443"
        default: "a1"
permissions: { contents: read, issues: write }
concurrency: { group: grab, cancel-in-progress: false }
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q oci
      - run: python grab.py
        env:
          MODE: ${{ github.event.inputs.mode || 'a1' }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
          OCI_REGION: ap-tokyo-1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_PUBKEY: "ssh-rsa "
